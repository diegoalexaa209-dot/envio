<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="TaskFlow, aplicación para organizar tareas."
    >

    <title>Barra de tareas</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="site-header">
        <div class="container">
            <h1>Tareas</h1>
            <p>organiza tu tarea de forma sencilla y ordenada</p>

            <time id="local-date"></time>
        </div>
    </header>

    <main class="container">

        <!-- FORMULARIO -->
        <section class="panel" aria-labelledby="form-title">

            <h2 id="form-title">Nueva tarea</h2>

            <form id="task-form">

                <div class="form-group">
                    <label for="task-title">
                        Tarea
                    </label>

                    <input
                        type="text"
                        id="task-title"
                        name="title"
                        required
                        maxlength="100"
                        placeholder="Tarea a realizar"
                    >
                </div>

                <div class="form-group">
                    <label for="task-priority">
                        Prioridad
                    </label>

                    <select id="task-priority" name="priority">
                        <option value="high">Alta</option>
                        <option value="medium" selected>Media</option>
                        <option value="low">Baja</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="task-category">
                        Categoría
                    </label>

                    <select id="task-category" name="category">
                        <option value="study">Estudio</option>
                        <option value="work">Trabajo</option>
                        <option value="personal">Personal</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="submit" id="submit-button">
                        Agregar tarea
                    </button>

                    <button
                        type="button"
                        id="cancel-button"
                        class="secondary-button"
                        hidden
                    >
                        Cancelar
                    </button>
                </div>

            </form>

        </section>


        <!-- PROGRESO -->
        <section class="panel" aria-labelledby="progress-title">

            <h2 id="progress-title">Progreso</h2>

            <progress
                id="progress-bar"
                value="0"
                max="100"
            >
            </progress>

            <p id="progress-text">
                0/0 tareas completadas
            </p>

        </section>


        <!-- MENSAJES -->
        <section
            aria-label="Mensajes de la aplicación"
            class="messages"
        >

            <p
                id="success-message"
                class="message success"
                role="status"
                hidden
            ></p>

            <p
                id="error-message"
                class="message error"
                role="alert"
                hidden
            ></p>

        </section>


        <!-- LISTA -->
        <section aria-labelledby="tasks-title">

            <div class="section-heading">
                <h2 id="tasks-title"></h2>

                <span id="task-count">
                    
                    
            </div>

            <div
                id="empty-state"
                class="empty-state"
                hidden
            >
                <h3>No hay tareas</h3>
                <p>
                    No existen tareas que coincidan con los filtros actuales.
                </p>

                <button
                    type="button"
                    id="show-all-button"
                    class="secondary-button"
                >
                    Ver todas
                </button>
            </div>

            <ul
                id="task-list"
                class="task-list"
                aria-live="polite"
            >
            </ul>

        </section>

    </main>


    <footer class="site-footer">
        <div class="container">
        
        </div>
    </footer>


    <script type="module" src="script.js"></script>

</body>
</html>

</body>
</html>
